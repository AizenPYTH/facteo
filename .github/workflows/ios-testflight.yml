# Build iOS sur un Mac de GitHub, puis envoi sur TestFlight.
#
# `eas build --local` ne consomme pas le quota de builds EAS : la compilation
# se fait ici, seuls les certificats Apple et le numéro de build sont lus sur
# EAS. L'envoi (`eas submit`) est gratuit.
#
# Prérequis : le secret EXPO_TOKEN (expo.dev › Account settings › Access
# tokens) dans Settings › Secrets and variables › Actions du dépôt.
# Lancement : onglet Actions › « iOS → TestFlight » › Run workflow.
name: iOS → TestFlight

on:
  workflow_dispatch:
    inputs:
      submit:
        description: Envoyer sur TestFlight après le build
        type: boolean
        default: true

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS (local, hors quota EAS)
        run: >-
          eas build --platform ios --profile production --local
          --non-interactive --output "$RUNNER_TEMP/inveq.ipa"

      - name: Archive du build
        uses: actions/upload-artifact@v4
        with:
          name: inveq-ios
          path: ${{ runner.temp }}/inveq.ipa
          retention-days: 14

      - name: Envoi sur TestFlight
        if: ${{ inputs.submit }}
        run: >-
          eas submit --platform ios --profile production
          --path "$RUNNER_TEMP/inveq.ipa" --non-interactive
